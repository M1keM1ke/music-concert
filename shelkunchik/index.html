<!DOCTYPE html>

            <stop offset="0%" stop-color="#e5fff0"/>
            <stop offset="45%" stop-color="#3aaa6a"/>

            <stop offset="0%" stop-color="#4a2c16"/>
            <stop offset="50%" stop-color="#8a5a32"/>

        aria-valuemax="100"
        aria-valuenow="0"

        <span id="thumb" aria-hidden="true"></span>

  <audio id="track" data-src="ukrashenie-i-zazhiganie-elki.mp3" preload="none" playsinline></audio>
